name: E2E

# Railway's GitHub integration posts deployment statuses; this runs the
# Playwright suite against each successful PR environment deployment.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: >-
          Public URL of the Railway PR environment to test, e.g.
          https://service-environment.up.railway.app
        required: true
        type: string

concurrency:
  group: e2e-${{ github.event.deployment.environment || inputs.base_url }}
  cancel-in-progress: true

jobs:
  e2e:
    # Railway PR environment names end in "-pr-<n>".
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      contains(github.event.deployment.environment, 'pr-'))
    runs-on: ubuntu-24.04
    steps:
      # Railway reports dashboard URLs in deployment_status URL fields, and
      # the environment as "<project> / <environment>". The generated service
      # domain follows <service>-<environment>.up.railway.app.
      - name: Resolve deployment URL
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ github.event.deployment.environment }}
          MANUAL_BASE_URL: ${{ inputs.base_url }}
          RAILWAY_SERVICE: skin-groove
        run: |
          if [ -n "$MANUAL_BASE_URL" ]; then
            url="${MANUAL_BASE_URL%/}"
          else
            environment="${DEPLOYMENT_ENVIRONMENT##*/}"
            environment="${environment//[[:space:]]/}"
            if [ -z "$environment" ]; then
              echo "No deployment environment was reported." >&2
              exit 1
            fi
            url="https://${RAILWAY_SERVICE}-${environment}.up.railway.app"
          fi
          echo "BASE_URL=$url" >> "$GITHUB_ENV"
          echo "Will test $url"
      - name: checkout
        uses: actions/checkout@v6
        with:
          # Manual dispatch: empty ref checks out the branch picked in the UI;
          # select the PR branch there.
          ref: ${{ github.event.deployment.sha }}
      - name: setup vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          version: '0.2.1'
          node-version: '24'
      - name: Install Playwright Browsers
        run: vpx playwright install chromium --with-deps --no-shell
      # Railway reports success before the edge routes the new domain.
      - name: Wait for deployment to be reachable
        run: |
          for attempt in $(seq 1 30); do
            status=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 20 "$BASE_URL" || true)
            if [ "$status" = "200" ]; then
              echo "Deployment is up (attempt $attempt)"
              exit 0
            fi
            echo "attempt $attempt: HTTP $status"
            sleep 10
          done
          echo "Deployment never became reachable at $BASE_URL" >&2
          exit 1
      - name: Run Playwright tests
        run: vp run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            .playwright/report/
            .playwright/test-results/
          include-hidden-files: true
          retention-days: 14

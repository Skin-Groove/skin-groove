allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
# Matches the CI install policy, so local resolution never picks a release
# that CI rejects.
minimumReleaseAge: 1440
# First-party packages publish only from the toolkit release workflow, after
# its checks pass.
minimumReleaseAgeExclude:
  - '@aamini/*'
# Peer resolution otherwise picks the @emnapi 2.0 beta for @astrojs/check, and
# that beta crashes `astro check` on exit ("bridge.deleteEnv is not a function").
# Remove these pins when @emnapi 2.0 is stable.
overrides:
  '@emnapi/core': ^1.11.3
  '@emnapi/runtime': ^1.11.3
